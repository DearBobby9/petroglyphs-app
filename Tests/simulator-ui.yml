name: PetroglyphsSimulatorChecks
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.6'
    SWIFT_VERSION: '5.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '2'
targets:
  PetroglyphsAcceptance:
    type: application
    platform: iOS
    sources:
      - path: ../Petroglyphs
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbyjia.petroglyphs.acceptance
        PRODUCT_NAME: PetroglyphsAcceptance
        INFOPLIST_FILE: ../Petroglyphs/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: '1.1'
  PetroglyphsSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PetroglyphsSimulatorUITests.swift
    dependencies:
      - target: PetroglyphsAcceptance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobbyjia.petroglyphs.acceptance.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PetroglyphsAcceptance
schemes:
  PetroglyphsSimulatorChecks:
    build:
      targets:
        PetroglyphsAcceptance: all
        PetroglyphsSimulatorUITests: [test]
    test:
      targets:
        - name: PetroglyphsSimulatorUITests
          parallelizable: false
